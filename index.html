<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>대전 온통대전 주유소 (유종별 실시간 유가 지도)</title>
  
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Firebase 10.8.0 Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8fafc;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    /* Top Control Bar */
    header {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }
    .header-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 8px 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(226, 232, 240, 0.8);
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .title-group h1 {
      font-size: 14px;
      font-weight: 800;
      color: #0f172a;
      white-space: nowrap;
    }
    .title-group span.badge {
      background: #2563eb;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
    }

    /* Filter Chips (휘발유 / 경유 / LPG / 전체) */
    .filters {
      display: flex;
      gap: 4px;
      pointer-events: auto;
      overflow-x: auto;
    }
    .chip {
      background: #f1f5f9;
      border: 1px solid transparent;
      border-radius: 16px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .chip.active {
      background: #0f172a;
      color: white;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.2);
    }
    .chip.active[data-type="gasoline"] {
      background: #2563eb;
    }
    .chip.active[data-type="diesel"] {
      background: #059669;
    }
    .chip.active[data-type="lpg"] {
      background: #d97706;
    }

    /* Map View */
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Floating Action Buttons */
    .fab-container {
      position: absolute;
      right: 14px;
      bottom: 54%;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: bottom 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .fab-container.sheet-collapsed {
      bottom: 68px;
    }
    .fab {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 4px 14px rgba(0,0,0,0.14);
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #334155;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
    }
    .fab:active {
      transform: scale(0.92);
    }
    .fab.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    /* Map Markers with Sharp Arrow Pointer & Anchor Dot */
    .marker-wrap {
      background: none !important;
      border: none !important;
    }
    .custom-station-pin {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      background: white;
      border: 2px solid #2563eb;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.22);
      font-size: 12px;
      font-weight: 800;
      color: #0f172a;
      white-space: nowrap;
      cursor: pointer;
      transform: translate(-50%, -100%);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: -8px;
    }
    .custom-station-pin:hover {
      transform: translate(-50%, -108%) scale(1.04);
      z-index: 9999 !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    .custom-station-pin.best-price {
      background: #fef2f2;
      border-color: #ef4444;
    }
    .custom-station-pin.best-price .price-val {
      color: #dc2626;
      font-weight: 900;
    }
    .best-badge {
      background: #ef4444;
      color: white;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 4px;
      margin-left: 2px;
    }

    .station-name {
      color: #0f172a;
      font-weight: 700;
    }
    .price-val {
      color: #2563eb;
      font-weight: 800;
      background: #eff6ff;
      padding: 1px 6px;
      border-radius: 12px;
      font-size: 11.5px;
    }
    .price-val.diesel-val {
      color: #059669;
      background: #ecfdf5;
    }
    .price-val.lpg-val {
      color: #d97706;
      background: #fffbeb;
    }

    /* 아래로 뾰족한 삼각형 화살표 침 (Arrow Pointer) */
    .custom-station-pin::after {
      content: '';
      position: absolute;
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 7px solid white;
      z-index: 3;
    }
    .custom-station-pin.best-price::after {
      border-top-color: #fef2f2;
    }
    .custom-station-pin::before {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 9px solid #2563eb;
      z-index: 2;
    }
    .custom-station-pin.best-price::before {
      border-top-color: #ef4444;
    }

    /* 브랜드별 테두리 및 침 색상 */
    .custom-station-pin.brand-hyundai { border-color: #0066b2; }
    .custom-station-pin.brand-hyundai:not(.best-price)::before { border-top-color: #0066b2; }
    .custom-station-pin.brand-hyundai i { color: #0066b2; }

    .custom-station-pin.brand-sk { border-color: #ea002c; }
    .custom-station-pin.brand-sk:not(.best-price)::before { border-top-color: #ea002c; }
    .custom-station-pin.brand-sk i { color: #ea002c; }

    .custom-station-pin.brand-soil { border-color: #008542; }
    .custom-station-pin.brand-soil:not(.best-price)::before { border-top-color: #008542; }
    .custom-station-pin.brand-soil i { color: #008542; }

    .custom-station-pin.brand-alttul { border-color: #ff7f00; }
    .custom-station-pin.brand-alttul:not(.best-price)::before { border-top-color: #ff7f00; }
    .custom-station-pin.brand-alttul i { color: #ff7f00; }

    .custom-station-pin.brand-gs { border-color: #007a87; }
    .custom-station-pin.brand-gs:not(.best-price)::before { border-top-color: #007a87; }
    .custom-station-pin.brand-gs i { color: #007a87; }

    .custom-station-pin.marker-lpg { border-color: #d97706; background: #fffbeb; }
    .custom-station-pin.marker-lpg::after { border-top-color: #fffbeb; }
    .custom-station-pin.marker-lpg:not(.best-price)::before { border-top-color: #d97706; }
    .custom-station-pin.marker-lpg i { color: #d97706; }

    /* 지면 앵커 도트 (정확한 위치점) */
    .anchor-dot {
      position: absolute;
      bottom: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 7px;
      height: 7px;
      background: #0f172a;
      border: 2px solid white;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      z-index: 4;
    }

    /* Bottom Sheet List */
    .bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -6px 28px rgba(0,0,0,0.14);
      z-index: 1000;
      height: 52%;
      max-height: 52%;
      display: flex;
      flex-direction: column;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      transform: translateY(0);
    }
    .bottom-sheet.collapsed {
      transform: translateY(calc(100% - 46px));
    }
    .sheet-handle-area {
      width: 100%;
      padding: 10px 0 6px 0;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      background: white;
      border-radius: 22px 22px 0 0;
    }
    .sheet-handle {
      width: 44px;
      height: 5px;
      background: #cbd5e1;
      border-radius: 3px;
      transition: background 0.2s;
    }
    .sheet-handle-area:hover .sheet-handle {
      background: #94a3b8;
    }
    .sheet-header {
      padding: 2px 18px 8px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f1f5f9;
    }
    .sheet-title-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sheet-title {
      font-size: 13px;
      font-weight: 800;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .last-sync-time {
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
    }
    .last-sync-time:empty {
      display: none;
    }
    .sort-options {
      display: flex;
      gap: 8px;
    }
    .sort-btn {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      background: none;
      border: none;
      cursor: pointer;
    }
    .sort-btn.active {
      color: #2563eb;
      font-weight: 700;
    }
    .station-list {
      overflow-y: auto;
      padding: 10px 14px 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .station-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.15s;
      cursor: pointer;
    }
    .station-card:hover, .station-card.selected {
      background: #eff6ff;
      border-color: #93c5fd;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .card-title-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .card-main-title {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      color: white;
    }
    .card-price-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      font-weight: 900;
      color: #2563eb;
    }
    .card-price-badge.diesel-color { color: #059669; }
    .card-price-badge.lpg-color { color: #d97706; }
    .card-sub-info {
      font-size: 11px;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card-addr {
      font-size: 12px;
      color: #475569;
    }
    .card-actions-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .btn-realtime-price {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: 0.15s;
      word-break: keep-all;
      text-align: center;
    }
    .btn-realtime-price:hover {
      background: #1d4ed8;
    }
    .btn-realtime-price.lpg-btn {
      background: #d97706;
    }
    .btn-realtime-price.lpg-btn:hover {
      background: #b45309;
    }
    .btn-sub-action {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      text-decoration: none;
      transition: 0.15s;
      word-break: keep-all;
    }
    .btn-sub-action:hover {
      background: #f1f5f9;
    }
    /* 시민 현장 검증 박스 (온통대전 신호등) */
    .verify-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 2px;
    }
    .verify-status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .verify-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
    }
    .verify-badge.status-ok {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .verify-badge.status-warn {
      background: #fefce8;
      color: #854d0e;
      border: 1px solid #fde047;
    }
    .verify-badge.status-bad {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .status-ok .status-dot { background: #10b981; }
    .status-warn .status-dot { background: #eab308; }
    .status-bad .status-dot { background: #ef4444; }
    .verify-meta {
      font-size: 10px;
      color: #94a3b8;
      font-weight: 500;
    }
    .verify-btn-group {
      display: flex;
      gap: 6px;
    }
    .btn-verify {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-verify:hover {
      background: #f8fafc;
    }
    .btn-verify.btn-ok:hover, .btn-verify.btn-ok.voted {
      background: #f0fdf4;
      border-color: #86efac;
      color: #166534;
    }
    .btn-verify.btn-bad:hover, .btn-verify.btn-bad.voted {
      background: #fef2f2;
      border-color: #fca5a5;
      color: #991b1b;
    }
    .btn-verify.voted {
      box-shadow: inset 0 0 0 1.5px currentColor;
    }
    .vote-num {
      font-family: monospace;
      font-size: 11px;
      font-weight: 800;
    }
    .status-pin-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1.5px solid white;
      position: absolute;
      top: -3px;
      right: -3px;
    }
    .status-pin-dot.status-ok { background: #10b981; }
    .status-pin-dot.status-warn { background: #eab308; }
    .status-pin-dot.status-bad { background: #ef4444; }
    .pin-verify-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 10px;
      line-height: 1.3;
      white-space: nowrap;
    }
    .pin-verify-badge.pin-ok {
      background: #059669;
      color: white;
    }
    .pin-verify-badge.pin-bad {
      background: #dc2626;
      color: white;
    }
    .pin-verify-badge.pin-warn {
      background: #d97706;
      color: white;
    }
    .pin-verify-badge.pin-none {
      background: #94a3b8;
      color: white;
      opacity: 0.85;
    }
    /* 토스트 알림 */
    #toastMsg {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15, 23, 42, 0.92);
      color: white;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }
    #toastMsg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<div id="app">
  <!-- Top Control Bar -->
  <header>
    <div class="header-card">
      <div class="title-group">
        <h1>온통대전</h1>
      </div>
      <!-- Fuel Type Chips: 기호 없이 글자만 -->
      <div class="filters">
        <div class="chip active" data-type="gasoline" onclick="setFuel('gasoline', this)">휘발유</div>
        <div class="chip" data-type="diesel" onclick="setFuel('diesel', this)">경유</div>
        <div class="chip" data-type="lpg" onclick="setFuel('lpg', this)">LPG</div>
        <div class="chip" data-type="all" onclick="setFuel('all', this)">전체</div>
      </div>
    </div>
  </header>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Floating Buttons -->
  <div class="fab-container" id="fabContainer">
    <button class="fab" id="gpsBtn" onclick="findMyLocation()" title="내 위치 찾기">
      <i class="fa-solid fa-location-crosshairs"></i>
    </button>
    <button class="fab" onclick="resetMapView()" title="대전 전체보기">
      <i class="fa-solid fa-compress"></i>
    </button>
  </div>

  <!-- Bottom Sheet List -->
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle-area" id="sheetHandleArea" onclick="toggleBottomSheet()">
      <div class="sheet-handle"></div>
    </div>
    <div class="sheet-header">
      <div class="sheet-title-group">
        <div class="sheet-title" id="listTitle">
          <span>휘발유 가격순 (9곳)</span>
        </div>
        <span class="last-sync-time" id="syncTime">최근 갱신: 2026.11.14 11:09</span>
      </div>
      <div class="sort-options">
        <button class="sort-btn active" id="sortPrice" onclick="sortStations('price')">가격순</button>
        <button class="sort-btn" id="sortDist" onclick="sortStations('dist')">거리순</button>
      </div>
    </div>
    <div class="station-list" id="stationList">
      <!-- Dynamic station cards will be rendered here -->
    </div>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // 100% 현장 검증 완료된 온통대전 실제 주유소 & 최신 유가 데이터
  const STATIONS = [
    // === 휘발유 / 경유 주유소 9곳 ===
    {
      id: 1,
      name: "에이스주유소",
      brand: "SK에너지",
      brandShort: "SK",
      brandColor: "#ea002c",
      type: "oil",
      fuel: { gasoline: 1828, diesel: 1818, lpg: null },
      lawName: "(주)신영에너지",
      addr: "대전 동구 동대전로 253 (가양동)",
      phone: "042-632-5289",
      lat: 36.34372,
      lng: 127.44668,
      placeUrl: "https://place.map.kakao.com/1445954313"
    },
    {
      id: 2,
      name: "가수원주유소",
      brand: "SK에너지",
      brandShort: "SK",
      brandColor: "#ea002c",
      type: "oil",

  function initVerification() {
    // 🧹 과거 테스트 가짜 데이터 로컬스토리지 강제 영구 삭제
    try {
      localStorage.removeItem('daejeon_gas_verifications');
      // 구버전 임시 투표 키들도 함께 초기화
      Object.keys(localStorage).forEach(k => {
        if (k.startsWith('vote_st_') || k.startsWith('my_vote_')) {
          localStorage.removeItem(k);
        }
      });
    } catch (e) {}

    // 0건으로 완전 리셋
    STATIONS.forEach(s => {
      verificationData[s.id] = { oper: 0, inoper: 0, lastTime: "" };
    });

    if (typeof firebase !== 'undefined' && firebaseConfig.apiKey && firebaseConfig.apiKey.length > 5 && !firebaseConfig.apiKey.includes('YOUR_')) {
      try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        isFirebaseReady = true;
        console.log("🔥 Firebase Firestore 실시간 연동 성공!");

        // Firestore 실시간 리스너 (Firestore에 저장된 '진짜 시민 데이터'만 표시)
        db.collection("daejeon_gas_verifications").onSnapshot(snapshot => {
          // 깨끗하게 0으로 초기화 후 Firestore 실제 데이터만 매핑
          STATIONS.forEach(s => {
            verificationData[s.id] = { oper: 0, inoper: 0, lastTime: "" };
          });
          snapshot.forEach(doc => {
            const id = Number(doc.id);
            const d = doc.data();
            if (verificationData[id]) {
              verificationData[id] = {
                oper: d.oper || 0,
                inoper: d.inoper || 0,
                lastTime: d.lastTime || ""
              };
            }
          });
          renderMarkers();
          renderList();
        }, err => {
          console.warn("Firestore listener error:", err);
        });
      } catch (err) {
        console.warn("Firebase init fallback to local:", err);
      }
    }
  }

  function getMyVote(id) {
    const today = new Date().toISOString().slice(0, 10);
    return localStorage.getItem(`vote_st_${id}_${today}`) || localStorage.getItem(`my_vote_${id}`) || null;
  }

  function getVerificationSummary(id) {
    const d = verificationData[id] || { oper: 0, inoper: 0, lastTime: '' };
    const total = d.oper + d.inoper;
    let status = 'warn'; // ok (운영 확인), warn (검증중), bad (미운영 의심)
    let statusText = '시민 검증 진행중';
    let ratioText = '';

    if (total === 0) {
      status = 'warn';
      statusText = '시민 검증 대기';
    } else {
      const operRatio = Math.round((d.oper / total) * 100);
      if (d.oper >= 3 && operRatio >= 75) {
        status = 'ok';
        statusText = '캐시백 확인됨';
        ratioText = `신뢰도 ${operRatio}%`;
      } else if (d.inoper >= 2 && operRatio < 50) {
        status = 'bad';
        statusText = '캐시백 불가/제외 의심';
        ratioText = `미운영 제보 ${d.inoper}건`;
      } else {
        status = 'warn';
        statusText = '검증 의견 갈림';
        ratioText = `성공 ${d.oper} / 실패 ${d.inoper}`;
      }
    }

    const myVote = getMyVote(id);
    return { ...d, total, status, statusText, ratioText, myVote };
  }

  function voteStation(id, type) {
    if (window.event) window.event.stopPropagation();
    const today = new Date().toISOString().slice(0, 10);
    const voteKey = `vote_st_${id}_${today}`;
    const currentVote = localStorage.getItem(voteKey) || localStorage.getItem(`my_vote_${id}`);
    const nowTime = "오늘 " + (new Date()).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

    // 1. 이미 동일한 버튼을 누른 경우 -> 취소 (Toggle Off)
    if (currentVote === type) {
      if (isFirebaseReady && db) {
        const dec = firebase.firestore.FieldValue.increment(-1);
        const updateData = {
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        if (type === 'oper') updateData.oper = dec;
        else updateData.inoper = dec;

        db.collection("daejeon_gas_verifications").doc(String(id)).set(updateData, { merge: true })
          .then(() => {
            localStorage.removeItem(voteKey);
            localStorage.removeItem(`my_vote_${id}`);
            showToast("↩️ 현장 검증 제보가 취소되었습니다.");
          })
          .catch(err => {
            showToast("취소 처리 오류: " + err.message);
          });
      } else {
        // Local Fallback
        if (verificationData[id]) {
          if (type === 'oper' && verificationData[id].oper > 0) verificationData[id].oper--;
          if (type === 'inoper' && verificationData[id].inoper > 0) verificationData[id].inoper--;
        }
        localStorage.removeItem(voteKey);
        localStorage.removeItem(`my_vote_${id}`);
        localStorage.setItem("daejeon_gas_verifications", JSON.stringify(verificationData));
        renderMarkers();
        renderList();
        showToast("↩️ 현장 검증 제보가 취소되었습니다.");
      }
      return;
    }

    // 2. 다른 버튼으로 변경하는 경우 (Switch: 기존 -1, 신규 +1)
    if (currentVote && currentVote !== type) {
      if (isFirebaseReady && db) {
        const inc = firebase.firestore.FieldValue.increment(1);
        const dec = firebase.firestore.FieldValue.increment(-1);
        const updateData = {
          lastTime: nowTime,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        if (type === 'oper') {
          updateData.oper = inc;
          updateData.inoper = dec;
        } else {
          updateData.inoper = inc;
          updateData.oper = dec;
        }

        db.collection("daejeon_gas_verifications").doc(String(id)).set(updateData, { merge: true })
          .then(() => {
            localStorage.setItem(voteKey, type);
            localStorage.setItem(`my_vote_${id}`, type);
            showToast(type === 'oper' ? "🔄 '캐시백 성공'으로 제보가 변경되었습니다!" : "🔄 '캐시백 불가'로 제보가 변경되었습니다!");
          })
          .catch(err => {
            showToast("제보 변경 오류: " + err.message);
          });
      } else {
        // Local Fallback
        if (!verificationData[id]) verificationData[id] = { oper: 0, inoper: 0, lastTime: '' };
        if (type === 'oper') {
          verificationData[id].oper++;
          if (verificationData[id].inoper > 0) verificationData[id].inoper--;
        } else {
          verificationData[id].inoper++;
          if (verificationData[id].oper > 0) verificationData[id].oper--;
        }
        verificationData[id].lastTime = nowTime;

        localStorage.setItem(voteKey, type);
        localStorage.setItem(`my_vote_${id}`, type);
        localStorage.setItem("daejeon_gas_verifications", JSON.stringify(verificationData));
        renderMarkers();
        renderList();
        showToast(type === 'oper' ? "🔄 '캐시백 성공'으로 제보가 변경되었습니다!" : "🔄 '캐시백 불가'로 제보가 변경되었습니다!");
      }
      return;
    }

    // 3. 신규 투표 (First Vote)
    if (isFirebaseReady && db) {
      const inc = firebase.firestore.FieldValue.increment(1);
      const updateData = {
        lastTime: nowTime,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      if (type === 'oper') updateData.oper = inc;
      else updateData.inoper = inc;

      db.collection("daejeon_gas_verifications").doc(String(id)).set(updateData, { merge: true })
        .then(() => {
          localStorage.setItem(voteKey, type);
          localStorage.setItem(`my_vote_${id}`, type);
          showToast(type === 'oper' ? "🟢 '캐시백 성공' 제보가 실시간 반영되었습니다! (다시 누르면 취소)" : "🔴 '캐시백 불가' 제보가 실시간 반영되었습니다! (다시 누르면 취소)");
        })
        .catch(err => {
          showToast("제보 전송 오류: " + err.message);
        });
    } else {
      // Local Fallback
      if (!verificationData[id]) verificationData[id] = { oper: 0, inoper: 0, lastTime: '' };
      if (type === 'oper') verificationData[id].oper++;
      else verificationData[id].inoper++;
      verificationData[id].lastTime = nowTime;

      localStorage.setItem(voteKey, type);
      localStorage.setItem(`my_vote_${id}`, type);
      localStorage.setItem("daejeon_gas_verifications", JSON.stringify(verificationData));
      renderMarkers();
      renderList();
      showToast(type === 'oper' ? "🟢 '캐시백 성공' 제보가 반영되었습니다! (다시 누르면 취소)" : "🔴 '캐시백 불가' 제보가 반영되었습니다! (다시 누르면 취소)");
    }
  }

  function showToast(msg) {
    let toast = document.getElementById('toastMsg');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'toastMsg';
      document.body.appendChild(toast);
    }
    toast.innerText = msg;
    toast.classList.add('show');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => {
      toast.classList.remove('show');
    }, 2500);
  }

  function setFuel(fuel, el) {
    currentFuel = fuel;
    document.querySelectorAll('.filters .chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');

    const filtered = getFilteredStations();

    let label = '휘발유';
    if (fuel === 'diesel') label = '경유';
    else if (fuel === 'lpg') label = 'LPG 충전소';
    else if (fuel === 'all') label = '전체';

    document.getElementById('listTitle').innerHTML = `<span>${label} (${filtered.length}곳)</span>`;

    renderMarkers();
    renderList();
  }

  function getStationPrice(st) {
    if (currentFuel === 'gasoline') return st.fuel.gasoline;
    if (currentFuel === 'diesel') return st.fuel.diesel;
    if (currentFuel === 'lpg') return st.fuel.lpg;
    // 'all'인 경우 휘발유 우선, 없으면 lpg
    return st.fuel.gasoline || st.fuel.lpg;
  }

  function getFilteredStations() {
    if (currentFuel === 'gasoline') return STATIONS.filter(s => s.fuel.gasoline !== null);
    if (currentFuel === 'diesel') return STATIONS.filter(s => s.fuel.diesel !== null);
    if (currentFuel === 'lpg') return STATIONS.filter(s => s.fuel.lpg !== null);
    return STATIONS;
  }

  function renderMarkers() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];

    const list = getFilteredStations();

    // 현재 선택된 유종 기준 최저가 계산
    let minPrice = 99999;
    list.forEach(s => {
      const p = getStationPrice(s);
      if (p && p < minPrice) minPrice = p;
    });

    list.forEach(st => {
      const isLpg = st.type === 'lpg';
      let brandClass = 'brand-hyundai';
      if (st.brand.includes('SK')) brandClass = 'brand-sk';
      else if (st.brand.includes('GS')) brandClass = 'brand-gs';
      else if (st.brand.includes('S-OIL')) brandClass = 'brand-soil';
      else if (st.brand.includes('알뜰')) brandClass = 'brand-alttul';

      const price = getStationPrice(st);
      const isBest = price && price === minPrice;
      const v = getVerificationSummary(st.id);

      let priceClass = '';
      if (currentFuel === 'diesel') priceClass = 'diesel-val';
      else if (currentFuel === 'lpg') priceClass = 'lpg-val';

      // 지도 위 마커 핀에 즉시 표시되는 시민 검증 신호등 뱃지
      let verifyPinBadge = '<span class="pin-verify-badge pin-none">미검증</span>';
      if (v.total > 0) {
        if (v.status === 'ok') {
          verifyPinBadge = `<span class="pin-verify-badge pin-ok"><i class="fa-solid fa-check"></i> ${v.oper}</span>`;
        } else if (v.status === 'bad') {
          verifyPinBadge = `<span class="pin-verify-badge pin-bad"><i class="fa-solid fa-xmark"></i> ${v.inoper}</span>`;
        } else {
          verifyPinBadge = `<span class="pin-verify-badge pin-warn">? ${v.oper}/${v.inoper}</span>`;
        }
      }

      // 마커 HTML: 주유소 이름 + 유가 + 시민 검증 뱃지
      const markerHtml = `
        <div class="custom-station-pin ${brandClass} ${isLpg ? 'marker-lpg' : ''} ${isBest ? 'best-price' : ''}">
          <span class="status-pin-dot status-${v.status}" title="${v.statusText}"></span>
          <i class="fa-solid fa-${isLpg ? 'fire-flame-simple' : 'gas-pump'}"></i>
          <span class="station-name">${st.name}</span>
          <span class="price-val ${priceClass}">${price ? price.toLocaleString() + '원' : '-'}</span>
          ${verifyPinBadge}
          ${isBest ? '<span class="best-badge">최저가</span>' : ''}
          <div class="anchor-dot"></div>
        </div>
      `;

      const customIcon = L.divIcon({
        className: 'marker-wrap',
        html: markerHtml,
        iconSize: null, // 글자 길이에 맞춰 유동적 자동 조절 (절대 안 잘림)
        iconAnchor: [0, 0] // 뾰족한 침 끝점이 지도 좌표에 정확히 꽂힘
      });

      const m = L.marker([st.lat, st.lng], { icon: customIcon }).addTo(map);

      // Popup Content
      const popupHtml = `
        <div style="min-width:230px; font-family:'Pretendard', sans-serif;">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
            <h3 style="font-size:14px; font-weight:800; color:#0f172a; margin:0;">${st.name}</h3>
            <span style="font-size:10px; background:${st.brandColor}; color:white; padding:2px 5px; border-radius:4px; font-weight:700;">${st.brandShort}</span>
          </div>
          <p style="font-size:11px; color:#64748b; margin-bottom:6px;">${st.addr}</p>
          <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:6px 10px; font-size:12px; margin-bottom:6px;">
            ${st.fuel.gasoline ? `<div>휘발유: <b style="color:#2563eb;">${st.fuel.gasoline.toLocaleString()}원</b></div>` : ''}
            ${st.fuel.diesel ? `<div>경유: <b style="color:#059669;">${st.fuel.diesel.toLocaleString()}원</b></div>` : ''}
            ${st.fuel.lpg ? `<div>LPG: <b style="color:#d97706;">${st.fuel.lpg.toLocaleString()}원</b></div>` : ''}
          </div>

          <!-- 시민 실시간 현장 검증 섹션 -->
          <div class="verify-box" onclick="event.stopPropagation()" style="margin-bottom:8px;">
            <div class="verify-status-bar">
              <div class="verify-badge status-${v.status}">
                <span class="status-dot"></span>
                <span>${v.statusText}</span>
                ${v.ratioText ? `<span style="opacity:0.8; font-weight:800; font-size:10px;">(${v.ratioText})</span>` : ''}
              </div>
              <span class="verify-meta">${v.lastTime ? '최근: ' + v.lastTime : '첫 제보 대기'}</span>
            </div>
            <div class="verify-btn-group">
              <button class="btn-verify btn-ok ${v.myVote === 'oper' ? 'voted' : ''}" onclick="voteStation(${st.id}, 'oper')" title="${v.myVote === 'oper' ? '클릭 시 제보 취소' : '캐시백 성공 제보'}">
                <i class="fa-solid fa-thumbs-up"></i> 돼요 <span class="vote-num">${v.oper}</span>
              </button>
              <button class="btn-verify btn-bad ${v.myVote === 'inoper' ? 'voted' : ''}" onclick="voteStation(${st.id}, 'inoper')" title="${v.myVote === 'inoper' ? '클릭 시 제보 취소' : '캐시백 불가 제보'}">
                <i class="fa-solid fa-thumbs-down"></i> 안 돼요 <span class="vote-num">${v.inoper}</span>
              </button>
            </div>
          </div>

          <p style="font-size:11px; color:#059669; font-weight:700; margin-bottom:8px;"><i class="fa-solid fa-check"></i> 가맹점 등록명: ${st.lawName}</p>
          <div style="display:flex; flex-direction:column; gap:6px;">
            <a href="${st.placeUrl}" target="_blank" style="display:flex; align-items:center; justify-content:center; gap:5px; background:#2563eb; color:white; padding:8px; border-radius:6px; font-size:12px; font-weight:700; text-decoration:none;">
              <i class="fa-solid fa-bolt"></i> ⚡ 실시간 가격 확인 (카카오/오피넷)
            </a>
            <div style="display:flex; gap:6px;">
              <a href="tel:${st.phone}" style="flex:1; text-align:center; background:#f8fafc; border:1px solid #cbd5e1; border-radius:6px; padding:6px; font-size:11px; font-weight:700; color:#334155; text-decoration:none;"><i class="fa-solid fa-phone"></i> 전화</a>
              <a href="https://map.kakao.com/link/to/${encodeURIComponent(st.name)},${st.lat},${st.lng}" target="_blank" style="flex:1; text-align:center; background:#0f172a; border-radius:6px; padding:6px; font-size:11px; font-weight:700; color:white; text-decoration:none;"><i class="fa-solid fa-location-arrow"></i> 길찾기</a>
            </div>
          </div>
        </div>
      `;
      m.bindPopup(popupHtml);
      m.on('click', () => {
        highlightCard(st.id);
      });
      markers.push(m);
    });
  }

  function renderList() {
    const listEl = document.getElementById('stationList');
    listEl.innerHTML = '';

    let filtered = [...getFilteredStations()];

    // Distance calculation if myLocation exists
    if (myLocation) {
      filtered.forEach(st => {
        st.dist = getDistance(myLocation.lat, myLocation.lng, st.lat, st.lng);
      });
    }

    // Sort
    if (currentSort === 'dist' && myLocation) {
      filtered.sort((a, b) => (a.dist || 999) - (b.dist || 999));
    } else {
      // 가격순 (오름차순)
      filtered.sort((a, b) => (getStationPrice(a) || 99999) - (getStationPrice(b) || 99999));
    }

    filtered.forEach((st, idx) => {
      const isLpg = st.type === 'lpg';
      const price = getStationPrice(st);
      const v = getVerificationSummary(st.id);
      const card = document.createElement('div');
      card.className = 'station-card';
      card.id = `card-${st.id}`;
      card.onclick = () => focusStation(st);

      let priceColorClass = '';
      if (currentFuel === 'diesel') priceColorClass = 'diesel-color';
      else if (currentFuel === 'lpg') priceColorClass = 'lpg-color';

      let fuelName = '휘발유';
      if (currentFuel === 'diesel') fuelName = '경유';
      else if (currentFuel === 'lpg') fuelName = 'LPG';

      card.innerHTML = `
        <div class="card-top">
          <div class="card-title-group">
            <div class="card-main-title">
              ${st.name}
              <span class="brand-pill" style="background:${st.brandColor};">${st.brandShort}</span>
              ${idx === 0 && currentSort === 'price' ? '<span class="best-badge" style="font-size:10px; padding:2px 6px;">최저가</span>' : ''}
            </div>
            <div class="card-sub-info">
              <span>${st.brand}</span>
              <span>&bull;</span>
              <span>등록명: ${st.lawName}</span>
              ${st.dist ? `<span>&bull;</span> <b>${st.dist.toFixed(1)}km</b>` : ''}
            </div>
          </div>
          <div class="card-price-badge ${priceColorClass}">
            <span style="font-size:11px; color:#64748b; font-weight:600;">${fuelName}</span>
            <span>${price ? price.toLocaleString() + '원' : '-'}</span>
          </div>
        </div>

        <div class="card-addr"><i class="fa-solid fa-location-dot" style="color:#94a3b8;"></i> ${st.addr}</div>

        <!-- 시민 실시간 현장 검증 박스 -->
        <div class="verify-box" onclick="event.stopPropagation()">
          <div class="verify-status-bar">
            <div class="verify-badge status-${v.status}">
              <span class="status-dot"></span>
              <span>${v.statusText}</span>
              ${v.ratioText ? `<span style="opacity:0.8; font-weight:800; font-size:10px;">(${v.ratioText})</span>` : ''}
            </div>
            <span class="verify-meta">${v.lastTime ? '최근 제보: ' + v.lastTime : '첫 제보 대기'}</span>
          </div>
          <div class="verify-btn-group">
            <button class="btn-verify btn-ok ${v.myVote === 'oper' ? 'voted' : ''}" onclick="voteStation(${st.id}, 'oper')" title="${v.myVote === 'oper' ? '클릭 시 제보 취소' : '캐시백 성공 제보'}">
              <i class="fa-solid fa-thumbs-up"></i> 캐시백 돼요 <span class="vote-num">${v.oper}</span>
            </button>
            <button class="btn-verify btn-bad ${v.myVote === 'inoper' ? 'voted' : ''}" onclick="voteStation(${st.id}, 'inoper')" title="${v.myVote === 'inoper' ? '클릭 시 제보 취소' : '캐시백 불가 제보'}">
              <i class="fa-solid fa-thumbs-down"></i> 안 돼요 <span class="vote-num">${v.inoper}</span>
            </button>
          </div>
        </div>

        <div class="card-actions-row">
          <a href="${st.placeUrl}" target="_blank" class="btn-realtime-price ${isLpg ? 'lpg-btn':''}" onclick="event.stopPropagation()">
            <i class="fa-solid fa-bolt"></i> 실시간 가격
          </a>
          <a href="https://map.kakao.com/link/to/${encodeURIComponent(st.name)},${st.lat},${st.lng}" target="_blank" class="btn-sub-action" onclick="event.stopPropagation()">
            <i class="fa-solid fa-location-arrow"></i> 길찾기
          </a>
          <a href="tel:${st.phone}" class="btn-sub-action" onclick="event.stopPropagation()">
            <i class="fa-solid fa-phone"></i> 전화
          </a>
        </div>
      `;
      listEl.appendChild(card);
    });
  }

  function focusStation(st) {
    map.setView([st.lat, st.lng], 15);
    markers.forEach(m => {
      const pos = m.getLatLng();
      if (Math.abs(pos.lat - st.lat) < 0.0001 && Math.abs(pos.lng - st.lng) < 0.0001) {
        m.openPopup();
      }
    });
    highlightCard(st.id);
  }

  function highlightCard(id) {
    document.querySelectorAll('.station-card').forEach(c => c.classList.remove('selected'));
    const target = document.getElementById(`card-${id}`);
    if (target) {
      target.classList.add('selected');
      target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  function sortStations(mode) {
    currentSort = mode;
    document.getElementById('sortPrice').classList.toggle('active', mode === 'price');
    document.getElementById('sortDist').classList.toggle('active', mode === 'dist');
    renderList();
  }

  function resetMapView() {
    map.setView([36.3504, 127.3845], 12);
  }

  // Find My Location
  let myLocMarker = null;
  function findMyLocation() {
    const btn = document.getElementById('gpsBtn');
    btn.classList.add('active');

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        myLocation = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude
        };
        if (myLocMarker) map.removeLayer(myLocMarker);

        const myIcon = L.divIcon({
          html: `<div style="width:16px; height:16px; background:#2563eb; border:3px solid white; border-radius:50%; box-shadow:0 0 10px rgba(37,99,235,0.8);"></div>`,
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        });
        myLocMarker = L.marker([myLocation.lat, myLocation.lng], { icon: myIcon }).addTo(map);
        map.setView([myLocation.lat, myLocation.lng], 14);

        sortStations('dist');
      }, err => {
        alert("GPS 위치 정보를 가져올 수 없습니다. 브라우저 위치 권한을 확인해 주세요.");
        btn.classList.remove('active');
      });
    } else {
      alert("현재 브라우저에서 GPS 위치 서비스를 지원하지 않습니다.");
      btn.classList.remove('active');
    }
  }

  function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  // Bottom Sheet Toggle & Gestures
  let isSheetCollapsed = false;

  function toggleBottomSheet(forceState = null) {
    if (forceState !== null) {
      isSheetCollapsed = forceState;
    } else {
      isSheetCollapsed = !isSheetCollapsed;
    }

    const sheet = document.getElementById('bottomSheet');
    const fabContainer = document.getElementById('fabContainer');

    if (isSheetCollapsed) {
      sheet.classList.add('collapsed');
      if (fabContainer) fabContainer.classList.add('sheet-collapsed');
    } else {
      sheet.classList.remove('collapsed');
      if (fabContainer) fabContainer.classList.remove('sheet-collapsed');
    }
  }

  function initSheetGestures() {
    const handleArea = document.getElementById('sheetHandleArea');
    if (!handleArea) return;

    let startY = 0;
    let endY = 0;

    handleArea.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
      endY = startY;
    }, { passive: true });

    handleArea.addEventListener('touchmove', (e) => {
      endY = e.touches[0].clientY;
    }, { passive: true });

    handleArea.addEventListener('touchend', () => {
      const diffY = endY - startY;
      if (diffY > 35 && !isSheetCollapsed) {
        toggleBottomSheet(true);
      } else if (diffY < -35 && isSheetCollapsed) {
        toggleBottomSheet(false);
      }
    });

    if (map) {
      map.on('click', () => {
        if (!isSheetCollapsed) {
          toggleBottomSheet(true);
        }
      });
    }
  }

  // 페이지 로드 시 최신 데이터 자동 동기화 (GitHub Actions가 갱신한 latest_station_prices.json 반영)
  async function checkLatestPricesOnLoad() {
    if (window.location.protocol === 'file:') return;
    try {
      const res = await fetch('latest_station_prices.json?t=' + Date.now());
      if (res.ok) {
        const data = await res.json();
        if (data.prices) {
          STATIONS.forEach(st => {
            if (data.prices[st.id]) {
              st.fuel.gasoline = data.prices[st.id].gasoline || st.fuel.gasoline;
              st.fuel.diesel = data.prices[st.id].diesel || st.fuel.diesel;
              st.fuel.lpg = data.prices[st.id].lpg || st.fuel.lpg;
            }
          });
          const syncEl = document.getElementById('syncTime');
          if (syncEl) syncEl.innerText = '최근 갱신: ' + data.updatedAt;
          renderMarkers();
          renderList();
        }
      }
    } catch (e) {}
  }

  window.onload = () => {
    initMap();
    initSheetGestures();
    checkLatestPricesOnLoad();
  };
</script>
<div id="toastMsg"></div>
</body>
</html>
