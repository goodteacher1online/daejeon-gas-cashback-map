name: Update Gas Prices

on:
  schedule:
    # 07:00 KST = 22:00 UTC(전날), 16:00 KST = 07:00 UTC
    - cron: '0 22 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Scrape latest prices
        run: python scripts/update_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html latest_station_prices.json
          git diff --staged --quiet || git commit -m "chore: auto-update gas prices"
          git push
